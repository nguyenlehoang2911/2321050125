<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        Nhap nam sinh: <input id="nam" type="number">
    </div>
    <div>
        Ket qua: <input id="ketQua" type="number">
    </div>
    <div>
        <button onclick="tinh()">Tinh tuoi</button>
    </div>
    <script>
        function tinh(){
            var namSinh = parseInt(document.getElementById("nam").value)

            document.getElementById("ketQua").value =tinhTuoi(namSinh)
        }
        
        function tinhTuoi(namSinh){
            var t = new Date();
            var r = t.getFullYear();
            var tuoi = parseInt(r) - namSinh;
            
            return tuoi;
        }
        
    </script>
</body>
</html>
