<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .anh{
            width:20%;
            display:flex;
            margin:auto;
        }
        .chuc-nang{
            display:flex;
            /* justify-content: center; */
            margin:auto;
        }
        .che-do{
            display:flex;
            justify-content: center;
            margin:auto;
        }
    </style>
</head>
<body>
    <div class="khung">
        <h1 class="che-do" id="che-do-sang">Chế độ sáng</h1>
        <img class="anh" src="../anh/mattroi.png">
        <div>
            <button onclick="doiCheDo()" class="chuc-nang">Đổi chế độ</button>
        </div>
    </div>
    <script>
        //cheDo (Boolean : true - sáng/ false - tối)
        let cheDo=true; 
        function doiCheDo() {
            if(cheDo==true){
                document.getElementsByTagName("body")[0].style = "background-color : black";
                document.getElementsByClassName("che-do")[0].style = "color : white";
                document.getElementsByClassName("che-do")[0].innerHTML = "Chế độ tối";
                document.getElementsByTagName("img")[0].src="../anh/mattrang.png";
                cheDo=false;
            }else{
                document.getElementsByTagName("body")[0].style = "background-color : white";
                document.getElementsByClassName("che-do")[0].style = "color : black";
                document.getElementsByClassName("che-do")[0].innerHTML = "Chế độ sáng";
                document.getElementsByTagName("img")[0].src="../anh/mattroi.png";
            cheDo=true;
            }
        }
    </script>
</body>
</html>
