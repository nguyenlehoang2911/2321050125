<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
         /*Internal Style*/
        h2{
           
            color:red;
            /* color dùng để quy định màu */
        }  

        #tieuDe{
            color:orange;
        }
    </style>
</head>
<body>
    <!-- I. Các kiểu style -->
    <!-- Kiểu 1 viết style trong thẻ -->
    <!-- Loại 1 Inline style -->
    <h1 style="color:blue">HUMG</h1>
    <!-- Kiểu 2 sử dụng selector -->
     <h2>Trường Đại học Mỏ - Địa chất</h2>
     <h3>Phát triển ứng dụng Web</h3>
    <!-- II. Selector  -->
    <!-- Cách 1: Dùng thẻ tên -->

    <!-- Cách 2: Dùng id - Viết dấu "#"" trước id -->
     <h2 id="tieuDe" class="tieuDe">Trường Đại học Mỏ - Địa chất</h2>
    <!-- Cách 3: Dùng class - Viết dấu "." trước class  -->
     <h4 class="tieuDe1">HUMG</h4>
    <!-- Cách 3: Dùng cả tên thẻ và class  -->
     <h3 class="tieuDe2">Phát triển ứng dụng Web</h3>
</body>
</html>
