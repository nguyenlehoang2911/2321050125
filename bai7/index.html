<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin:0;
        }
        .danhmuc{
            background-color:#2fa4e7;
            height:50px;
        }
        .danh-sach-muc{
            padding:0;
            margin:0;
            display:flex;
            list-style: none;
            padding:15px;
            gap:20px;
            font-family: arial;
            font-family: bold;
        }
        a{
            color:aliceblue;
            text-decoration: none;
            font-family: Arial;
            font-weight: bold;
            
        }
        a:hover{
            color:#72ccfe;
        }
        main{
            display:flex;
        }
        .left-content{
            width:20%;
            height:100vh;
            border-right:2px solid #2fa4e7;
        }
        .right-content{
            width:80%;
            height:100vh;
        }
        .login{
            display:flex;
            justify-content: center;
        }
        form{
            width:80%;
            margin: 10px auto;
        }
        .khoi-thong-tin{
            width:100%;
            margin-bottom:10px;
        }
        p{
            margin-bottom:0;
        }
        input{
            width:100%;
            padding:5px 0;
            border-radius: 5px;
        }
        .quen-mat-khau{
            margin-left: 115px;
            
        }
        a.quenmk{
            color:#2fa4e7;
            font-style: italic;
        }
        button{
            width:100%;
            padding:5px 0;
        }
        .b1{
            background-color:#2fa4e7;
            border-radius: 5px;
            margin-top: 10px;
            color:aliceblue;
            font-family: arial;
            font-weight: bold;
            cursor:pointer;
        }
        .b2{
            background-color:rgb(54, 113, 224);
            border-radius: 5px;
            margin-top: 10px;
            color:aliceblue;
            font-family:arial;
            font-weight: bold;
            cursor:pointer;
        }
        .tin{
            width:95%;
            background-color:antiquewhite;
            height:100px;
            margin:20px auto;
            border:1px solid #2fa4e7;
            border-radius:10px;
        }
        .chuc-nang{
            width:95%;
            display:flex;
            justify-content: space-between;
            margin:5px auto;
            border-bottom:1px solid #2fa4e7;
        }
        .lien-ket-xem-tiep{
            color:#2fa4e7
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <nav class="danhmuc">
                <ul class="danh-sach-muc">
                    <li class="muc"><a href="#">Thực tập, Đồ án</a></li>
                    <li class="muc"><a href="#">Thủ tục Một cửa</a></li>
                    <li class="muc"><a href="#">Một Cửa online</a></li>
                    <li class="muc"><a href="#">Email HUMG</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="left-content">
            <div class="login">
                <form action="">
                    <div class="khoi-thong-tin">
                        <p>Tài khoản</p>
                        <input
                            type="text"
                            placeholder=""
                        >
                    </div>

                    <div class="khoi-thong-tin">
                        <p>Mật khẩu</p>
                        <input
                            type="password"
                        >
                    </div>
                    <div class="quen-mat-khau">
                        <a href="#" class="quenmk">Quên mật khẩu?</a>
                    </div>
                    <div class="khoi-thong-tin">
                        <button class="b1">Đăng nhập</button>
                        <button class="b2">Đăng nhập với Microft office 365</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="right-content">
            <div class="danh-sach-tin">
                <div class="tin">
                    <div class="chuc-nang">
                        <div class="tieu_de">Tin tức</div>
                        <div class="xem-tiep"><a href="#" class="lien-ket-xem-tiep">Xem tiếp</a></div>
                    </div>
                </div>
            </div>


        </div>
    </main>
</body>
</html>
