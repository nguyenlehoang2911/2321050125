<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>
    <!-- Internal JavaScript -->
    <script>
        // In ra màn hình
        document.writeln("Hello World! <br> ");

        // Khai báo biến

        var name="Lê Hoàng <br>";
        document.writeln(name);

        name="Ly <br>";
        document.writeln(name);

        var year = 2026;
        document.writeln(year + "<br>");

        // Phép toán
        var soThuNhat = 10;
        var soThuHai = 5;
        var ketQua = 0;
        // Cộng
        document.writeln("<br> Kết quả là:")
        ketQua = soThuNhat + soThuHai;
        document.writeln(ketQua +"<br>");
        //Trừ
        document.writeln("<br> Kết quả là:")
        ketQua = soThuNhat - soThuHai;
        document.writeln(ketQua +"<br>");
        //Nhân
        document.writeln("<br> Kết quả là:")
        ketQua = soThuNhat * soThuHai;
        document.writeln(ketQua +"<br>");
        //Chia
        document.writeln("<br> Kết quả là:")
        ketQua = soThuNhat / soThuHai;
        document.writeln(ketQua +"<br>");
        //%
        document.writeln("<br> Kết quả là:")
        ketQua = soThuNhat % soThuHai;
        document.writeln(ketQua +"<br>");

        //++ 
        document.writeln("<br>");
        document.writeln(++soThuNhat);
        //--
        document.writeln("<br>");
        document.writeln(--soThuNhat);
        //+= soThuNhat= soThuNhat+soThuHai
        soThuNhat += soThuHai;
        document.writeln(soThuNhat +"<br>");
        //-=
        soThuNhat -= soThuHai;
        document.writeln(soThuNhat +"<br>");
        //Nối chuỗi
        var ho ="Nguyen"
        document.writeln("<br>" + ho + " " + name)
        document.writeln("<br>")
        //Kiểm tra độ dài chuỗi
        document.writeln(ho.length);
        //Kiểm tra kiểu dữ liệu của biến
        document.writeln(ho.constructor + "<br>");
        document.writeln(typeof(ho))
        document.writeln("<br>")
        //
        var hoVaTen="Nguyễn Lê Hoàng";
        document.writeln(hoVaTen.indexOf("Hoàng"));
        document.writeln("<br>")
        document.writeln(hoVaTen.includes("e"));
        document.writeln("<br>")
        document.writeln(hoVaTen.startsWith("Nguyễn"));
        document.writeln(hoVaTen.replace("Lê", "Văn"));
        document.writeln("<br>");
        document.write(hoVaTen.toLocaleUpperCase());
        document.writeln("<br>");
        document.write(hoVaTen.toLocaleLowerCase());

        //Date
        var homNay = new Date();
        document.writeln("<br>")
        document.writeln(homNay);

        var ngay = new Date("9/30/2025");
        document.writeln("<br>");
        document.writeln(ngay);

        var namNay = homNay.getFullYear();
        document.writeln("<br>");
        document.writeln(namNay);

        var thangNay = homNay.getMonth() + 1;
        document.writeln("<br>");
        document.writeln(thangNay);

        var ngayHomNay = homNay.getDate();
        document.writeln("<br>")
        document.writeln(ngayHomNay);

        var thu = homNay.getDay() + 1;
        document.writeln("<br>");
        document.writeln(thu);
        document.writeln("<br>");
        document.writeln("hom nay la thu" + " " + thu + " " + "ngay" + " " + ngayHomNay + " " + "thang" + " " + thangNay );

        //Mảng
        var mangSo = [1,2,3,4,5];
        document.writeln("<br>");
        document.writeln(mangSo[2]);
        document.writeln("<br>");
        document.writeln(mangSo.length);

        var mangTen = ["Quang Anh", "Ly", "Thang"]
        document.writeln("<br>");
        document.writeln(mangTen[2]);

        var mang =[1,2,3,4,5, "Quang Anh", "Ly", "Thang"]
        document.writeln("<br>");
        document.writeln(mang[5]);

        var d = mang.concat(mangSo, mangTen);
        document.writeln("<br>");
        document.writeln(d.join("-"));
        document.writeln("<br>");
        document.writeln(d.pop()); // lấy phần tử cuối trong mảng
        document.writeln("<br>");
        d.push("Duy") // Thêm phần tử vào mảng
        document.writeln(d);
        document.writeln("<br>");
        document.writeln(mangSo.reverse()); // đảo mảng

        //Object
        var thongTinSinhVien = {
            ten: "Nguyen Le Hoang",
            namSinh : 2005,
            queQuan : {
                thanhPho : "Hai Phong",
                huyen : "Tan Ky"
            }
        };
        document.writeln("<br>");
        document.writeln(thongTinSinhVien.ten);
        document.writeln(thongTinSinhVien.queQuan.thanhPho);
        tuoi = namNay - thongTinSinhVien.namSinh;
        thongTinSinhVien.tuoi=tuoi;
        // console.log(thongTinSinhVien);
        //boolean :True Nam / False nữ
        thongTinSinhVien.gioiTinh = true;

        var mangThongTin = [
            {
                ten: "Nguyen Van A",
                namSinh : 2005,
                queQuan : {
                    thanhPho : "Hai Phong",
                    huyen : "Tan Ky"
                },
            },
            {
                ten: "Nguyen Van B",
                namSinh : 2005,
                queQuan : {
                    thanhPho : "Hai Phong",
                    huyen : "Tan Ky"
                },
            }

        ];
        // console.log(mangThongTin);
            // == != > <
            // === so sánh cả giá trị và kiểu dữ liệu
        var so1 = 5;
        var so2 = "10";
        document.writeln("<br>");
        document.writeln(so1 === so2);
        // ||(hoặc) &&(và)
        if(thu > 6 ){
            document.writeln("Cuối tuần");
        } else if(thu == 6){
            document.writeln("Sắp được ngủ")
        }   
        else {
            document.writeln("Đi học")
        }

        document.writeln("<br>");
        var so = 2000000000001;
        if(so%2 === 0){
            document.writeln("số chẵn");
        }else{
            document.writeln("số lẻ");
        }
        document.writeln("<br>");
        // var so = "20000000000000001"
        // var doDai = so.length;
        // var soCuoiCung = so[doDai-1];

        //Switch case
        var d = new Date();
        var theDay = d.getDay();
        switch(theDay) {
            case 5:
                document.write("Finally Friday");
                break;
            case 6:
                document.write("Super Saturday");
                break;
            case 0:
                document.write("Sleepy Sunday");
                break;
            default:
                document.write("I'm looking forward to this weekend")
        }

        
        //Loop For

        for (var index = 1; index <= 10; index++){
            document.writeln("<br>");
            document.writeln("test lần thứ" + index);
        }


        for(var i = 0; i < mang.length; i++){
            document.writeln("<br>");
            // document.writeln(typeof(mang[i]));
            document.writeln(mang[i]);
            document.writeln("<br>");
            if (isNaN(mang[i]) == false){
                document.write("xinchao" + " " + mang[i]);
            } 
            else{
                document.write("hello");
            }
        }

        //While
        i=0;
        while(i <= 10) {
            document.writeln("The number is " + i);
            document.writeln("<br>");
            i=i+1;
        }
        document.writeln("<br>");
        var j = 0;
        do{
            document.write("The number is " + j);
            document.write("<br>");
            j = j + 1;

        }while (j <= 10);

        //Popup boxes
        alert("Hello");

        var r = confirm("Press a button");
        if (r == true ) {
            document.write("You pressed OK!")
        }
        else {
            document.write("You presses Cancel!")
        }
        document.writeln("<br>");

        var r = prompt("Test", "Type here");
        document.write(r);

        
    </script>
    <!-- External JavaScript -->
     <script src="script.js"></script>
</body>
</html>
