<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin:0;
        }
        .header-container{
            display: flex;
            justify-content: space-between;
            margin:0px 20px;
        }
        .header-button{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login{
            width: 60px;
            height: 25px;
            border-radius: 10px;
            border: none;
            background-color: lightgrey;
        }
        .danh-sach-muc{
            list-style: none;
        }
        a{
            text-decoration: none;
        }
        .muc{
            padding:10px;
        }
        .tieu-de{
            padding-left: 70px;
            h4{
                color:grey;
                font-family: 'Times New Roman';
                font-weight: 100;
            }
        }
        .main-container{
            display: flex;
            width:100%;
        }
        .main-left{
            width:20%;
            height:500px;
            margin-top: 150px;
        }
        .main-right{
            width:80%;
            height:500px;
            display:flex;
        }
        .right-content{
            width: 50%;
            margin-top:200px;
            h4{
                color: black;
                font-family: 'Times New Roman';
                font-weight:100;
            }
        }
        .sth{
            display: flex;
        }
        .sth1-button{
            background-color: black;
            color:white;
            border-radius: 10px;
            border:none;
            width: 90px;
            height:30px;
        }
        .left-content{
            width: 50%;
            height:1000px;

        }
        .img{
            width: 300px;
            height: 300px;
            background-color: aqua;
            margin: 10px;
        }
        .left-button{
            margin:130px 80px;
            height:50px;
            width:150px;
            border:none;
            border-radius: 10px;
            font-family: 'Arial';
            font-size:larger;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <h1>OpenAI</h1>
            </div>
            <div class="header-button">
                <button class="login">Login</button>
            </div>
        </div>
    </header>
    <main>
        <div class="main-container">
            <div class="main-left">
                <div class="tieu-de">
                    <h4>Home</h4>
                </div>
                <div class="danh-sach">
                    <nav class="danhmuc">
                        <ul class="danh-sach-muc">
                            <li class="muc"><a href="#">AI Platform</a></li>
                            <li class="muc"><a href="#">AI Pricing</a></li>
                            <li class="muc"><a href="#">Codex</a></li>
                            <li class="muc"><a href="#">Open Model</a></li>
                            <li class="muc"><a href="#">Community</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
            <div class="main-right">
                <div class="right-content">
                    <div class="tieu-de-main">
                        <h1>Codex</h1>
                    </div>
                    <div class="noi-dung">
                        <h4>
                            One angent for every where you code-included in chat GPT Plus, Pro, Business, Edu, Enterprice Plans.
                        </h4>
                    </div>
                    <div class="sth">
                        <div class="sth1">
                            <button class="sth1-button">Get Started</button>
                        </div>
                        <div class="sth1-content">
                            $ npm i -g @openai/codex
                        </div>
                    </div>
                </div>
                <div class="left-content">
                    <div class="img">
                        <button class="left-button">Code Review</button>
                    </div>
                    <div class="img">
                        <button class="left-button">eb/aig</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer></footer>
</body>
</html>
