<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        margin:0;
    }
    .header-container{
        background-color:#2fa4e7;
        display:flex;
    }
    ul{
        display:flex;
        list-style: none;
        gap:20px;
        font-family: Arial;
        font-weight: bold;
    }
    a{
        color:aliceblue;
        text-decoration: none;
    }
    a:hover{
        color:#72ccfe;
    }
    main{
        display:flex;   
    }
    .left-container{
        background-color:red;
        width:20%;
        
    }
    .right-container{
        background-color:green;
        width:80%;
    }
    .login{
        display:flex;
        
        justify-content: center;
    }
    input{
        width:270px;
        height:30px;
        border-radius: 10px;
    }
    p{
        margin-bottom: 0;
    }
    a.quenmk{
        margin-left: 170px;
        
        color:#2fa4e7;
        font-style: italic;
    }
    .button{
        text-align: center;
    }
    .b1{
        padding: 10px 103px 10px 103px;
        margin: 10px 0px 10px 0px;
        background-color:#2fa4e7;
        border-radius:9px;
        color:aliceblue;
        cursor:pointer;
    }
    .b2{
        padding: 10px 40px 10px 40px;
        margin: 0px 0px 10px 0px;
        background-color: #2fa4e7;
        border-radius:9px;
        color:aliceblue;
        cursor:pointer;
    }
</style>
<body>
    <header>
        <div class="header-container">
            <nav class="danhmuc">
                <ul>
                    <li><a href="#">Thực tập, Đồ án</a></li>
                    <li><a href="#">Thủ tục Một cửa</a></li>
                    <li><a href="#">Một Cửa online</a></li>
                    <li><a href="#">Email HUMG</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="left-container">
            <div class="login">
                <form>
                    <div>
                        <p>Tài khoản</p>
                        <input
                            type="text"
                            placeholder=""
                        >
                    </div>

                    <div>
                        <p>Mật khẩu</p>
                        <input
                            type="password"
                        >
                    </div>
                    <div>
                        <a href="#" class="quenmk">Quên mật khẩu?</a>
                    </div>
                    <div class="button">
                        <div>
                            <button class="b1">Đăng nhập</button>
                        </div>

                        <div>
                            <button class="b2">Đăng nhập với Microft office 365</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>


        <div class="right-container">
            <div>dagsuidgiaud</div>
        </div>
    </main>
    <footer></footer>
</body>
</html>
